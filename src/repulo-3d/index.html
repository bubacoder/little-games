<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Repülő Madár 3D – Kerüld el a fákat!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    #g { position: relative; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; }

    /* ── HUD ── */
    #hud {
      position: absolute; top: 14px; left: 14px;
      pointer-events: none; z-index: 10;
      font-family: 'Press Start 2P', monospace;
    }
    #score-el { display: block; color: #60e878; font-size: 14px; text-shadow: 0 0 10px #60e878; }
    #best-el  { display: block; color: #3d6040; font-size: 9px;  margin-top: 8px; }

    /* ── Overlay (title / game-over) ── */
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,6,0,0.72); z-index: 20;
      font-family: 'Press Start 2P', monospace;
    }
    #overlay.hidden { display: none; }
    #panel { text-align: center; padding: 24px; max-width: 480px; }
    #ptitle {
      font-size: clamp(18px, 5vw, 26px); line-height: 1.9;
      margin-bottom: 26px;
    }
    #pbody {
      color: #aaffcc; font-size: clamp(8px, 2vw, 11px);
      line-height: 2.5; margin-bottom: 26px;
    }
    #phint {
      color: #60e878; font-size: clamp(7px, 1.8vw, 9px);
      text-shadow: 0 0 10px #60e878;
      animation: blink .76s ease-in-out infinite alternate;
    }
    @keyframes blink { from { opacity: .55 } to { opacity: 1 } }

    /* ── Touch buttons ── */
    #ctrl {
      position: absolute; bottom: 18px; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 22px; z-index: 15; pointer-events: none;
    }
    .btn {
      width: 86px; height: 86px; border-radius: 50%;
      border: 3px solid rgba(80,220,100,.48);
      background: rgba(0,28,10,.80);
      color: #5be870; font-size: 30px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      pointer-events: auto; cursor: pointer; transition: .08s;
      font-family: sans-serif;
    }
    .btn.on { background: rgba(0,72,30,.9); transform: scale(.91); }

    /* ── Pályaválasztó gombok ── */
    #level-wrap { display:none; margin-top:22px; }
    .lvl-btn {
      font-family: 'Press Start 2P', monospace; font-size:8px; line-height:2.3;
      color:#60e878; background:rgba(0,20,10,.85);
      border:2px solid rgba(80,220,100,.42); border-radius:8px;
      padding:14px 12px; cursor:pointer; text-align:center;
      transition:.12s; min-width:100px;
    }
    .lvl-btn:hover { background:rgba(0,55,20,.9); border-color:#60e878; transform:scale(1.06); }
    .lvl-btn.sel   { border-color:#60e878; box-shadow:0 0 14px #28a858; }
  </style>
</head>
<body>
<div id="g">
  <canvas id="c"></canvas>

  <div id="hud">
    <span id="score-el">⭐ 0</span>
    <span id="best-el">rekord: 0</span>
  </div>

  <div id="overlay">
    <div id="panel">
      <div id="ptitle"></div>
      <div id="pbody"></div>
      <div id="phint">[ SPACE / ENTER / KOPPINTS ]</div>
      <div id="level-wrap">
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
          <button class="lvl-btn" id="btn-day">🌤️<br><br>NAPPALI<br>ERDŐ</button>
          <button class="lvl-btn" id="btn-night">🌙<br><br>ÉJJELI<br>ERDŐ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <div class="btn" id="bl">◀</div>
    <div class="btn" id="br">▶</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════
   RENDERER
═══════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputEncoding    = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ad4f0);
scene.fog        = new THREE.FogExp2(0x8ad4f0, 0.013);

const camera = new THREE.PerspectiveCamera(72, 1, 0.1, 200);
let camX = 0;

function resize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════
   LIGHTS
═══════════════════════════════════════ */
const hemiLight = new THREE.HemisphereLight(0x9ad4f0, 0x4a8a20, 0.55);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xfff5d0, 1.15);
sun.position.set(10, 20, 12);
sun.castShadow = true;
Object.assign(sun.shadow.mapSize, { width: 1024, height: 1024 });
Object.assign(sun.shadow.camera,  { left:-30, right:30, top:20, bottom:-20, near:.5, far:100 });
sun.shadow.bias = -0.0015;
scene.add(sun);

const ambLight = new THREE.AmbientLight(0x8090b0, 0.38);
scene.add(ambLight);

/* ═══════════════════════════════════════
   GROUND
═══════════════════════════════════════ */
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 300),
  new THREE.MeshLambertMaterial({ color: 0x4aaa28 })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

/* ═══════════════════════════════════════
   CLOUDS (decorative, flat discs in sky)
═══════════════════════════════════════ */
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.82 });
function makeCloud(x, y, z) {
  const g = new THREE.Group();
  [[0,0,0,1.8],[1.5,.3,0,1.3],[-1.4,.2,0,1.2],[.6,.7,0,1.1]].forEach(([cx,cy,cz,r]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), cloudMat);
    m.position.set(cx, cy, cz);
    g.add(m);
  });
  g.position.set(x, y, z);
  scene.add(g);
  return g;
}
const clouds = [];
for (let i = 0; i < 10; i++) {
  clouds.push(makeCloud(
    (Math.random() - .5) * 50,
    12 + Math.random() * 8,
    -20 - Math.random() * 70
  ));
}

/* ═══════════════════════════════════════
   MATERIALS (reused across trees)
═══════════════════════════════════════ */
const M = {
  trunk1: new THREE.MeshLambertMaterial({ color: 0x5c3310 }),
  trunk2: new THREE.MeshLambertMaterial({ color: 0x6b4018 }),
  pine: [
    new THREE.MeshLambertMaterial({ color: 0x163a06 }),
    new THREE.MeshLambertMaterial({ color: 0x1e5209 }),
    new THREE.MeshLambertMaterial({ color: 0x286a0e }),
  ],
  round: [
    new THREE.MeshLambertMaterial({ color: 0x1c5408 }),
    new THREE.MeshLambertMaterial({ color: 0x286e10 }),
    new THREE.MeshLambertMaterial({ color: 0x348018 }),
  ],
};

/* ═══════════════════════════════════════
   DECORATIVE ELEMENT MATERIALS
═══════════════════════════════════════ */
const D = {
  rock: new THREE.MeshLambertMaterial({ color: 0x888077 }),
  bush: new THREE.MeshLambertMaterial({ color: 0x1e5c08 }),
  stem: new THREE.MeshLambertMaterial({ color: 0x357a18 }),
  fl:   [0xff5577, 0xffdd22, 0xcc55ff, 0xff8833].map(c =>
          new THREE.MeshLambertMaterial({ color: c })),
  fur:  new THREE.MeshLambertMaterial({ color: 0xd0c09a }),
  deer: new THREE.MeshLambertMaterial({ color: 0xb07030 }),
};
// Szentjánosbogár (éjjeli pályához)
const fireflyMat = new THREE.MeshBasicMaterial({ color: 0x99ffbb });
const fireflyGeo = new THREE.SphereGeometry(0.07, 5, 4);

/* ═══════════════════════════════════════
   TREE FACTORIES
═══════════════════════════════════════ */
function makePine(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.set(.85 + Math.random()*.3, .75 + Math.random()*.5, .85 + Math.random()*.3);

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,2.2,8), M.trunk1);
  trunk.position.y = 1.1; trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);

  // Three stacked cone layers
  [[M.pine[2],1.48,1.9,1.9],[M.pine[1],1.12,1.9,3.1],[M.pine[0],.76,1.8,4.15]].forEach(([mat,r,h,y]) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r,h,9), mat);
    c.position.y = y; c.castShadow = true;
    g.add(c);
  });

  scene.add(g);
  return g;
}

function makeOak(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(.8 + Math.random()*.45);

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.13,.20,2.8,8), M.trunk2);
  trunk.position.y = 1.4; trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);

  // Lumpy canopy from 3 overlapping spheres
  [[M.round[0],.0, 3.6,.0, 1.2],
   [M.round[1],.32,3.9,.22,1.05],
   [M.round[2],-.28,3.75,-.18,.95]].forEach(([mat,ox,oy,oz,r]) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r,10,8), mat);
    s.position.set(ox,oy,oz); s.castShadow = true;
    g.add(s);
  });

  scene.add(g);
  return g;
}

/* ═══════════════════════════════════════
   DECORATIVE FACTORIES
═══════════════════════════════════════ */
function makeDecRock(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(.5 + Math.random() * .65);
  [[0,.28,0,.28],[.22,.18,.1,.2],[-.18,.14,-.08,.18]].forEach(([ox,oy,oz,r],i) => {
    if (i===0 || Math.random()<.65) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r,5,4), D.rock);
      m.position.set(ox,oy,oz); m.castShadow=true; g.add(m);
    }
  });
  scene.add(g); return g;
}

function makeDecBush(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(1.0 + Math.random() * 0.7);
  [[0,.3,0,.32],[.27,.2,.05,.24],[-.23,.18,.1,.21]].forEach(([ox,oy,oz,r]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r,7,5), D.bush);
    m.position.set(ox,oy,oz); m.castShadow=true; g.add(m);
  });
  scene.add(g); return g;
}

function makeDecFlower(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const n = 2 + Math.floor(Math.random()*3);
  for (let i=0; i<n; i++) {
    const fx=(Math.random()-.5)*.5, fz=(Math.random()-.5)*.5;
    const st = new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.36,4), D.stem);
    st.position.set(fx,.18,fz); g.add(st);
    const hd = new THREE.Mesh(new THREE.SphereGeometry(.1,6,5), D.fl[Math.floor(Math.random()*4)]);
    hd.position.set(fx,.40,fz); g.add(hd);
  }
  scene.add(g); return g;
}

function makeDecRabbit(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = Math.random()*Math.PI*2;
  g.scale.setScalar(.75 + Math.random()*.35);
  const body = new THREE.Mesh(new THREE.SphereGeometry(.18,7,5), D.fur);
  body.position.set(0,.22,0); body.scale.set(1,1.15,1.3); body.castShadow=true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,6,5), D.fur);
  head.position.set(0,.43,-.14); head.castShadow=true; g.add(head);
  [-.055,.055].forEach(ex => {
    const ear = new THREE.Mesh(new THREE.CylinderGeometry(.028,.034,.21,5), D.fur);
    ear.position.set(ex,.61,-.13); g.add(ear);
  });
  scene.add(g); return g;
}

function makeDecDeer(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = Math.random()*Math.PI*2;
  g.scale.setScalar(.85 + Math.random()*.3);
  const body = new THREE.Mesh(new THREE.SphereGeometry(.3,8,6), D.deer);
  body.position.set(0,.52,0); body.scale.set(1,.9,1.75); body.castShadow=true; g.add(body);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.085,.115,.28,6), D.deer);
  neck.position.set(0,.8,-.28); neck.rotation.x=-.35; g.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,7,5), D.deer);
  head.position.set(0,.98,-.46); head.castShadow=true; g.add(head);
  [[-0.14,.16],[0.14,.16],[-0.14,-.16],[0.14,-.16]].forEach(([lx,lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(.042,.033,.46,5), D.deer);
    leg.position.set(lx,.23,lz); g.add(leg);
  });
  // Agancs (mindkét oldal)
  [-1, 1].forEach(s => {
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(.013,.020,.30,5), D.deer);
    stem.position.set(s*.07, 1.22, -.46); stem.rotation.z = s*.30; stem.castShadow=true; g.add(stem);
    const b1 = new THREE.Mesh(new THREE.CylinderGeometry(.009,.013,.20,4), D.deer);
    b1.position.set(s*.13, 1.33, -.51); b1.rotation.x=-.65; b1.rotation.z=s*.15; g.add(b1);
    const b2 = new THREE.Mesh(new THREE.CylinderGeometry(.008,.011,.15,4), D.deer);
    b2.position.set(s*.09, 1.40, -.44); b2.rotation.z=s*.60; b2.rotation.x=.25; g.add(b2);
  });
  scene.add(g); return g;
}

const DEC_MAKERS = [
  makeDecRock, makeDecRock, makeDecBush, makeDecBush,
  makeDecFlower, makeDecFlower, makeDecFlower,
  makeDecRabbit, makeDecDeer, makeDecDeer,
];

/* ═══════════════════════════════════════
   BIRD
═══════════════════════════════════════ */
const BM = {
  body: new THREE.MeshLambertMaterial({ color: 0xffd700 }),
  wing: new THREE.MeshLambertMaterial({ color: 0xe8b810 }),
  beak: new THREE.MeshLambertMaterial({ color: 0xff8c00 }),
  eye:  new THREE.MeshBasicMaterial ({ color: 0x111111 }),
  shine:new THREE.MeshBasicMaterial ({ color: 0xffffff }),
};

function makeBird() {
  const root = new THREE.Group();

  // Body — elongated sphere facing -Z
  const body = new THREE.Mesh(new THREE.SphereGeometry(.34,12,9), BM.body);
  body.scale.z = 1.65; body.castShadow = true;
  root.add(body);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(.22,10,8), BM.body);
  head.position.set(0,.18,-.46); head.castShadow = true;
  root.add(head);

  // Beak (cone pointing -Z)
  const beak = new THREE.Mesh(new THREE.ConeGeometry(.065,.22,7), BM.beak);
  beak.rotation.x = -Math.PI/2; beak.position.set(0,.14,-.70);
  root.add(beak);

  // Tail feathers
  const tail = new THREE.Mesh(new THREE.ConeGeometry(.12,.28,5), BM.wing);
  tail.rotation.x = Math.PI/2; tail.position.set(0,-.06,.56);
  root.add(tail);

  // Wing pivots (so rotation looks natural)
  const lPivot = new THREE.Group(); lPivot.position.set(-.36,0,0);
  const rPivot = new THREE.Group(); rPivot.position.set( .36,0,0);

  const wingGeo = new THREE.BoxGeometry(.78,.065,.42);
  [lPivot, rPivot].forEach((piv, side) => {
    const w = new THREE.Mesh(wingGeo, BM.wing);
    w.position.x = (side===0 ? -.39 : .39);
    w.castShadow = true;
    // Wing tip taper
    const tip = new THREE.Mesh(new THREE.BoxGeometry(.28,.055,.22), BM.wing);
    tip.position.set((side===0 ? -.55 : .55), 0, .05);
    w.add(tip);
    piv.add(w);
  });
  root.add(lPivot); root.add(rPivot);

  // Eye + glint
  const eye   = new THREE.Mesh(new THREE.SphereGeometry(.072,7,6), BM.eye);
  eye.position.set(-.14,.26,-.55);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(.030,5,5), BM.shine);
  glint.position.set(-.145,.275,-.595);
  root.add(eye); root.add(glint);

  root.position.set(0, 1.9, 0);
  scene.add(root);
  return { root, lPivot, rPivot };
}

const bird = makeBird();

/* ═══════════════════════════════════════
   AUDIO
═══════════════════════════════════════ */
let ac;
function tone(freq, type, dur, vol=.22, endF) {
  if (!ac) ac = new (AudioContext || webkitAudioContext)();
  if (ac.state==='suspended') ac.resume();
  const o=ac.createOscillator(), g=ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type=type; o.frequency.value=freq;
  if (endF) { o.frequency.setValueAtTime(freq,ac.currentTime); o.frequency.exponentialRampToValueAtTime(endF,ac.currentTime+dur); }
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.start(); o.stop(ac.currentTime+dur);
}
const sndCrash  = () => tone(150,'sawtooth',.4,.45,40);
const sndScore  = () => { tone(440,'sine',.08,.18); setTimeout(()=>tone(660,'sine',.1,.18),80); };
const sndWhoosh = () => tone(700,'sawtooth',.1,.1,100);

/* ═══════════════════════════════════════
   INPUT
═══════════════════════════════════════ */
const K = { l:false, r:false };
window.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft' ||e.key==='a') K.l=true;
  if (e.key==='ArrowRight'||e.key==='d') K.r=true;
  if ((e.key===' '||e.key==='Enter') && (gs==='title'||gs==='dead')) showLevelSelect();
  if ([' ','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.key==='ArrowLeft' ||e.key==='a') K.l=false;
  if (e.key==='ArrowRight'||e.key==='d') K.r=false;
});
window.addEventListener('mouseup', () => { K.l=K.r=false; });

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on  = e => { K[key]=true;  el.classList.add('on');    e.preventDefault(); };
  const off = ()  => { K[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart',  on,  {passive:false});
  el.addEventListener('touchend',    off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown',   on,  {passive:false});
  el.addEventListener('mouseup',     off);
}
bindBtn('bl','l'); bindBtn('br','r');

/* ═══════════════════════════════════════
   UI helpers
═══════════════════════════════════════ */
const overlay  = document.getElementById('overlay');
const ptitle   = document.getElementById('ptitle');
const pbody    = document.getElementById('pbody');
const scoreEl  = document.getElementById('score-el');
const bestEl   = document.getElementById('best-el');

const phintEl    = document.getElementById('phint');
const levelWrap  = document.getElementById('level-wrap');

function showScreen(title, col, body) {
  overlay.classList.remove('hidden');
  ptitle.innerHTML = title;
  ptitle.style.cssText = `color:${col};text-shadow:0 0 22px ${col}`;
  pbody.innerHTML = body;
  phintEl.style.display = '';
  levelWrap.style.display = 'none';
}
function hideScreen() { overlay.classList.add('hidden'); }

function showTitle() {
  gs = 'title';
  showScreen('🐦 REPÜLŐ<br>MADÁR 3D','#60e878',
    'Kerüld el a fákat!<br>◀ ▶ nyilak / gombok' +
    (best>0?`<br><br><span style="color:#ffd700">Rekord: ${best}</span>`:'')
  );
}

function showLevelSelect() {
  gs = 'levelselect';
  overlay.classList.remove('hidden');
  ptitle.innerHTML = '🌍 VÁLASSZ<br>PÁLYÁT!';
  ptitle.style.cssText = 'color:#60e878;text-shadow:0 0 22px #60e878';
  pbody.innerHTML = '';
  phintEl.style.display = 'none';
  levelWrap.style.display = 'block';
  document.getElementById('btn-day').classList.toggle('sel', level===1);
  document.getElementById('btn-night').classList.toggle('sel', level===2);
}

overlay.addEventListener('click', () => {
  if (gs==='title' || gs==='dead') showLevelSelect();
});
document.getElementById('btn-day').addEventListener('click', e => {
  e.stopPropagation(); level=1; init();
});
document.getElementById('btn-night').addEventListener('click', e => {
  e.stopPropagation(); level=2; init();
});
function updateHUD() {
  scoreEl.textContent = `⭐ ${score}`;
  bestEl.textContent  = `rekord: ${best}`;
}

/* ═══════════════════════════════════════
   GAME STATE
═══════════════════════════════════════ */
let gs = 'title';
let level = 1; // 1 = nappali, 2 = éjjeli
let score = 0, best = +localStorage.getItem('rm3d-best') || 0;
let spd, tick, birdVx, wingPhase, spawnT, spawnGap;

// Obstacles: { mesh, x, r, passed, id, _w }
let obs = [];
let spawnRowId = 0;
const scoredRowIds = new Set();
// Background (decorative) trees
let bgMeshes = [];
// Dekoratív elemek (kő, bokor, virág, nyúl, szarvas)
let decMeshes = [];
// Szentjánosbogarak
let fireflies = [], fireflyT = 0;

const BIRD_R     = 0.28; // collision radius (world units)
const TREE_R     = 0.62; // collision radius for all trees
const FIELD_HALF = 13;   // pálya fél-szélessége (kb. képernyő-szél)

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init() {
  gs='playing'; score=0; tick=0;
  spd=0.18; spawnT=0; spawnGap=92;
  birdVx=0; wingPhase=0;

  bird.root.position.set(0,1.9,0);
  bird.root.rotation.set(0,0,0);
  camX=0;

  // Pálya-téma beállítása
  if (level === 1) {
    scene.background.setHex(0x8ad4f0);
    scene.fog = new THREE.FogExp2(0x8ad4f0, 0.013);
    groundMesh.material.color.setHex(0x4aaa28);
    hemiLight.color.setHex(0x9ad4f0); hemiLight.groundColor.setHex(0x4a8a20); hemiLight.intensity=0.55;
    sun.color.setHex(0xfff5d0); sun.intensity=1.15;
    ambLight.color.setHex(0x8090b0); ambLight.intensity=0.38;
  } else {
    scene.background.setHex(0x030e18);
    scene.fog = new THREE.FogExp2(0x030e18, 0.019);
    groundMesh.material.color.setHex(0x0a1a04);
    hemiLight.color.setHex(0x0a1828); hemiLight.groundColor.setHex(0x030802); hemiLight.intensity=0.28;
    sun.color.setHex(0xb0c8f0); sun.intensity=0.40;
    ambLight.color.setHex(0x040c18); ambLight.intensity=0.18;
  }
  clouds.forEach(c => { c.visible = level===1; });

  // Szentjánosbogarak (csak éjjeli pálya)
  fireflies.forEach(f => scene.remove(f.mesh));
  fireflies = []; fireflyT = 0;
  if (level === 2) {
    for (let i=0; i<22; i++) {
      const mesh = new THREE.Mesh(fireflyGeo, fireflyMat);
      mesh.position.set((Math.random()-.5)*22, .5+Math.random()*2.2, -8-Math.random()*55);
      fireflies.push({ mesh, sx:(Math.random()-.5)*.015, sy:(Math.random()-.5)*.006, phase:Math.random()*Math.PI*2 });
      scene.add(mesh);
    }
  }

  obs.forEach(o => scene.remove(o.mesh));
  obs = [];
  spawnRowId = 0;
  scoredRowIds.clear();

  bgMeshes.forEach(m => scene.remove(m));
  bgMeshes = [];
  decMeshes.forEach(m => scene.remove(m));
  decMeshes = [];

  // Seed decorative background trees (széles, nyílt terep)
  for (let i=0; i<36; i++) {
    const side = Math.random()<.5 ? -1 : 1;
    const x    = side*(11 + Math.random()*18);
    const z    = -85 + i * 4.2 + Math.random()*3;
    const m    = Math.random()<.5 ? makePine(x,z) : makeOak(x,z);
    bgMeshes.push(m);
  }

  // Dekoratív elemek szétszórva a pályán
  for (let i=0; i<22; i++) {
    const x = (Math.random()-.5) * 24;
    const z = -78 + i * 3.8 + Math.random() * 2.5;
    decMeshes.push(DEC_MAKERS[Math.floor(Math.random()*DEC_MAKERS.length)](x, z));
  }

  hideScreen();
  updateHUD();
}

/* ═══════════════════════════════════════
   SPAWN
═══════════════════════════════════════ */
function makeTree(x, z) {
  return Math.random() < .55 ? makePine(x, z) : makeOak(x, z);
}

function spawnObs() {
  const bx = bird.root.position.x;
  // Előrejelzés: hova ér a madár mire a fa odaér (a pálya határain belül)
  const raw  = bx + birdVx * Math.min(68 / spd, 80);
  const aimX = Math.max(-FIELD_HALF + 1, Math.min(FIELD_HALF - 1, raw));
  const id = spawnRowId++;

  if (score <= 3) {
    // Könnyű kezdés: egy szimpla fa
    const x = aimX + (Math.random() - 0.5) * 9.0;
    obs.push({ mesh: makeTree(x, -68), x, r: TREE_R, passed: false, id });
    return;
  }

  // Fa-sor egy átjáróval – a madár nem kerülheti ki oldalra
  const gapX  = aimX + (Math.random() - 0.5) * 3.0; // átjáró közel a madárhoz
  const gapH  = 1.5 + Math.random() * 0.7;           // fél-rés: ~3-4 egység széles átjáró
  const halfW = Math.min(5.5 + score * 0.18, 11);    // sor szélessége nő a pontszámmal
  const step  = 3.2;

  for (let dx = -halfW; dx <= halfW + 0.1; dx += step) {
    const tx = aimX + dx;
    if (Math.abs(tx - gapX) >= gapH) {
      obs.push({ mesh: makeTree(tx, -68), x: tx, r: TREE_R, passed: false, id });
    }
  }
}

/* ═══════════════════════════════════════
   UPDATE
═══════════════════════════════════════ */
function update() {
  tick++;

  // Continuous speed ramp
  spd      = Math.min(0.68, spd + 0.00014);
  spawnGap = Math.max(42,   spawnGap - 0.018);

  // Bird steering
  if (K.l) birdVx -= 0.030;
  if (K.r) birdVx += 0.030;
  if (!K.l && !K.r) birdVx *= 0.82;
  birdVx = Math.max(-.40, Math.min(.40, birdVx));
  bird.root.position.x = Math.max(-FIELD_HALF, Math.min(FIELD_HALF, bird.root.position.x + birdVx));

  // Wing flap
  wingPhase += 0.17 + spd * 0.2;
  bird.lPivot.rotation.z =  Math.sin(wingPhase)*.5 + .08;
  bird.rPivot.rotation.z = -Math.sin(wingPhase)*.5 - .08;

  // Banking when turning
  bird.root.rotation.z += (-birdVx * 1.8 - bird.root.rotation.z) * .14;

  // Camera: mindig a madár mögött, középen
  camX += (bird.root.position.x - camX) * .12;
  camera.position.set(camX, 3.0, 9.5);
  camera.lookAt(camX, 0.6, -14);

  // Nap/hold követi a kamerát
  const sunOff = level===1 ? [camX+10, 20, 12] : [camX-6, 20, 8];
  sun.position.set(...sunOff);
  sun.target.position.set(camX, 0, 0);
  sun.target.updateMatrixWorld();

  // Spawn obstacles
  if (++spawnT >= spawnGap) { spawnObs(); spawnT=0; }

  const bx = bird.root.position.x;

  // Obstacles
  for (let i=obs.length-1; i>=0; i--) {
    const o = obs[i];
    o.mesh.position.z += spd;

    const tz = o.mesh.position.z;

    // Collision: csak x-irányú távolság, miután a fa eléri a madár z-síkját
    const dx = bx - o.mesh.position.x;
    if (tick>60 && tz >= -0.15 && tz < 2.2 && Math.abs(dx) < BIRD_R + o.r) {
      sndCrash();
      if (score>best) { best=score; localStorage.setItem('rm3d-best',best); }
      gs='dead';
      showScreen('BUMM! 💥','#ff3c4a',
        `Elkerült fák: ${score}<br><br>` +
        (score>0&&score>=best?'<span style="color:#ffd700">🏆 ÚJ REKORD!</span><br><br>':'') +
        `<span style="color:#446644">Legjobb: ${best} fa</span>`
      );
      return;
    }

    // Near-miss whoosh
    if (!o._w && tz > -2.0 && tz < 2.2 && Math.abs(dx) < BIRD_R + o.r + 1.0) {
      sndWhoosh(); o._w=true;
    }

    // Score – fa-soronként egyszer számít
    if (!o.passed && tz > 1.8) {
      o.passed = true;
      if (!scoredRowIds.has(o.id)) {
        scoredRowIds.add(o.id);
        score++;
        if (score%5===0) sndScore();
        updateHUD();
      }
    }

    if (tz>22) { scene.remove(o.mesh); obs.splice(i,1); }
  }

  // Background trees: loop back when they pass camera
  bgMeshes.forEach(m => {
    m.position.z += spd;
    if (m.position.z > 20) {
      const side = Math.random()<.5 ? -1 : 1;
      m.position.set(camX + side*(11+Math.random()*18), 0, -80 + Math.random()*6);
    }
  });

  // Dekoratív elemek scrollolása
  decMeshes.forEach(m => {
    m.position.z += spd;
    if (m.position.z > 20) {
      m.position.set(camX + (Math.random()-.5)*24, 0, -80 + Math.random()*4);
    }
  });

  // Szentjánosbogarak (éjjeli pálya)
  if (level === 2) {
    fireflyT += 0.055;
    fireflies.forEach(f => {
      f.mesh.position.x += f.sx;
      f.mesh.position.y += f.sy;
      f.mesh.position.z += spd * 0.25;
      f.sx += (Math.random()-.5)*.0022; f.sx=Math.max(-.025,Math.min(.025,f.sx));
      f.sy += (Math.random()-.5)*.001;
      if (f.mesh.position.y < .3)  f.sy =  Math.abs(f.sy);
      if (f.mesh.position.y > 3.2) f.sy = -Math.abs(f.sy);
      f.mesh.scale.setScalar(.6 + .6*Math.sin(fireflyT*2.8 + f.phase));
      if (f.mesh.position.z > 12) {
        f.mesh.position.set(camX+(Math.random()-.5)*22, .5+Math.random()*2.2, -55+Math.random()*5);
      }
    });
  }

  // Clouds drift slowly
  clouds.forEach(c => {
    c.position.z += spd * .18;
    if (c.position.z > 20) {
      c.position.set(camX + (Math.random()-.5)*50, c.position.y, -70);
    }
  });

  // Ground follows camera (X és Z is)
  groundMesh.position.x = camX;
  groundMesh.position.z = camera.position.z - 130;
}

/* ═══════════════════════════════════════
   LOOP
═══════════════════════════════════════ */
function loop() {
  if (gs==='playing') update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

showTitle();
updateHUD();
loop();
</script>
