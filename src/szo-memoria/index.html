<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szó-Memória 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --pink:#ff9ec4; --purple:#a78bfa; --mint:#7fe0c4; --peach:#ffc499;
  --sky:#8fd3ff; --sun:#ffd873;
  --ink:#4a3b6b; --ink-soft:#7c6ba0;
  --card-radius:16px;
}

html,body{height:100%;}
body{
  font-family:'Fredoka',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 15%, #ffe3f1 0%, transparent 45%),
    radial-gradient(circle at 85% 20%, #e3ecff 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, #dcfbef 0%, transparent 55%),
    linear-gradient(160deg,#fef6ff 0%,#eef2ff 55%,#e6fbf4 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* floating background doodles */
.bg-doodles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-doodles span{
  position:absolute;font-size:34px;opacity:.28;
  animation:floaty linear infinite;
}
@keyframes floaty{
  0%{transform:translateY(20px) rotate(0deg);}
  50%{transform:translateY(-20px) rotate(12deg);}
  100%{transform:translateY(20px) rotate(0deg);}
}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:12px 14px 24px;}

/* ---------- header ---------- */
.title{
  text-align:center;font-weight:700;letter-spacing:.5px;
  font-size:clamp(28px,7vw,46px);
  color:transparent;background:linear-gradient(100deg,#ff7eb3,#a78bfa 55%,#4fd6b8);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 rgba(167,139,250,.18));
}
.subtitle{text-align:center;color:var(--ink-soft);margin-top:2px;font-size:clamp(13px,3.4vw,17px);}

/* ---------- panels / buttons ---------- */
.panel{
  background:rgba(255,255,255,.72);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 10px 30px rgba(150,120,200,.15);
  backdrop-filter:blur(6px);
  border-radius:22px;padding:13px 15px;margin-top:12px;
}
.panel h2{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:8px;}

/* combined compact options row */
.setup-opts{display:flex;gap:12px;flex-wrap:wrap;}
.opt-group{flex:1 1 200px;min-width:0;}
.opt-group h2{margin-bottom:7px;}

.seg{display:flex;flex-wrap:wrap;gap:7px;}
.seg button, .opt{
  font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);
  border:2px solid rgba(167,139,250,.25);background:#fff;
  border-radius:13px;padding:7px 12px;cursor:pointer;
  transition:transform .12s,border-color .15s,background .15s,box-shadow .15s;
  display:flex;align-items:center;gap:6px;line-height:1.12;
}
.seg button:hover,.opt:hover{transform:translateY(-2px);}
.seg button.active,.opt.active{
  border-color:var(--purple);
  background:linear-gradient(135deg,#f3ecff,#e9fff8);
  box-shadow:0 4px 14px rgba(167,139,250,.28);
}
.seg button small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:400;}

/* topic grid */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.topic{
  position:relative;border:2px solid rgba(255,255,255,.9);border-radius:16px;
  padding:9px 5px 8px;text-align:center;cursor:pointer;background:#fff;
  transition:transform .12s,box-shadow .15s,border-color .15s;
}
.topic:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(150,120,200,.2);}
.topic.active{border-color:var(--purple);box-shadow:0 8px 22px rgba(167,139,250,.35);}
.topic .emo{font-size:27px;display:block;line-height:1;}
.topic .nm{font-size:12px;font-weight:600;margin-top:4px;color:var(--ink);line-height:1.1;}
.topic .diff{font-size:10px;margin-top:2px;letter-spacing:1px;}
.topic .bar{height:5px;border-radius:5px;margin-top:6px;opacity:.85;}
.topic.random{background:linear-gradient(135deg,#fff0f8,#eef6ff,#e9fff6);}

.start-row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap;}
.big-btn{
  font-family:inherit;font-weight:700;font-size:19px;color:#fff;border:none;cursor:pointer;
  padding:14px 34px;border-radius:20px;
  background:linear-gradient(135deg,#ff7eb3,#a78bfa 60%,#4fd6b8);
  box-shadow:0 8px 22px rgba(167,139,250,.4);
  transition:transform .12s,box-shadow .15s,filter .15s;
}
.big-btn:hover{transform:translateY(-2px) scale(1.02);}
.big-btn:active{transform:translateY(0) scale(.99);}
.big-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(150,120,200,.18);}
.big-btn:disabled{filter:grayscale(.6) brightness(1.05);opacity:.6;cursor:not-allowed;box-shadow:none;}

.toggle-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* ---------- game screen ---------- */
.hidden{display:none !important;}

.topbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.72);border:2px solid rgba(255,255,255,.9);
  border-radius:20px;padding:10px 12px;box-shadow:0 8px 22px rgba(150,120,200,.15);
}
.pill{
  display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;
  background:#fff;border:2px solid rgba(167,139,250,.2);border-radius:14px;padding:7px 12px;
}
.pill b{color:var(--purple);}
.icon-btn{
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink);
  border:2px solid rgba(167,139,250,.25);background:#fff;border-radius:14px;padding:7px 12px;
  transition:transform .12s,background .15s;
}
.icon-btn:hover{transform:translateY(-2px);background:#f6f1ff;}
.combo{
  color:#ff6f61;font-weight:700;transition:transform .2s;
}
.combo.pop{transform:scale(1.35);}

/* board */
.board{
  display:grid;gap:clamp(7px,1.8vw,13px);
  grid-template-columns:repeat(var(--cols,4),1fr);
  margin:12px auto 0;max-width:760px;
}
.card{
  position:relative;aspect-ratio:3/4;cursor:pointer;
  perspective:700px;
  animation:dealIn .4s cubic-bezier(.2,1.4,.4,1) backwards;
}
@keyframes dealIn{from{opacity:0;transform:scale(.4) rotate(-8deg);}to{opacity:1;}}
.card-inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.9,.3,1.2);
  border-radius:var(--card-radius);
}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--card-radius);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:6px;
  box-shadow:0 5px 14px rgba(120,90,170,.22);
}
/* back (face down) */
.back{
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.4) 0%, transparent 35%),
    var(--topic-color,#a78bfa);
  color:#fff;overflow:hidden;
}
.back::before{
  content:'';position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(circle, rgba(255,255,255,.9) 2px, transparent 2.5px);
  background-size:18px 18px;
}
.back .motif{font-size:clamp(26px,7vw,44px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));z-index:1;}
/* front (revealed) */
.front{
  transform:rotateY(180deg);
  background:linear-gradient(160deg,#ffffff,#fbf6ff);
  border:2px solid rgba(167,139,250,.3);
}
.front .fx-emoji{font-size:clamp(24px,6.5vw,40px);line-height:1;}
.front .fx-word{
  font-weight:600;color:var(--ink);line-height:1.05;margin-top:3px;
  font-size:clamp(11px,3.1vw,19px);word-break:break-word;hyphens:auto;
}
.front .fx-sub{
  font-size:clamp(9px,2.4vw,13px);color:var(--ink-soft);font-weight:400;margin-top:1px;
}
.front .lang-tag{
  position:absolute;top:5px;left:6px;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:8px;color:#fff;letter-spacing:.3px;
}
.lang-tag.hu{background:#ff8fb3;}
.lang-tag.en{background:#6fb6f0;}

.card.matched{cursor:default;}
.card.matched .front{
  border-color:#6fdcb0;
  background:linear-gradient(160deg,#eafff6,#d9fbee);
  box-shadow:0 0 0 2px #6fdcb0,0 6px 16px rgba(80,200,150,.35);
  animation:matchPop .5s ease;
}
@keyframes matchPop{0%{transform:rotateY(180deg) scale(1);}40%{transform:rotateY(180deg) scale(1.14);}100%{transform:rotateY(180deg) scale(1);}}
.card.matched{animation:settle .5s ease;}
@keyframes settle{0%{transform:translateY(0);}30%{transform:translateY(-10px);}100%{transform:translateY(0);}}
.card.wrong .front{animation:shake .4s;}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-7px);}75%{transform:rotateY(180deg) translateX(7px);}}

/* dísz-kártyák: üres helyeket töltenek ki. Hátlapjuk PONT olyan, mint a többi kártyáé,
   így nem lehet megmondani, melyik a kitöltő. Csak kattintásra fordulnak fel (meglepetés),
   és úgy is maradnak. A játékmenetbe nem szólnak bele. */
.card.filler{cursor:pointer;animation:fillerIn .45s ease backwards;}
.card.filler .front{
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.65) 0%, transparent 42%),
    linear-gradient(140deg,#ffd6ec 0%,#d9c6ff 50%,#c4f0e4 100%);
  border:2px solid rgba(167,139,250,.4);
}
.card.filler .fmotif{font-size:clamp(26px,7vw,44px);line-height:1;animation:wiggle 2.8s ease-in-out infinite;}
.card.filler.flipped .fmotif{animation:surprisePop .6s ease, wiggle 2.8s 0.6s ease-in-out infinite;}
.card.filler .sparkle{position:absolute;font-size:13px;opacity:.85;animation:twinkle 1.8s ease-in-out infinite;}
.card.filler .sparkle.a{top:10%;left:14%;}
.card.filler .sparkle.b{bottom:12%;right:16%;animation-delay:.9s;}
@keyframes wiggle{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.12);}}
@keyframes twinkle{0%,100%{transform:scale(.5);opacity:.25;}50%{transform:scale(1.1);opacity:.9;}}
@keyframes surprisePop{0%{transform:scale(0) rotate(-30deg);}60%{transform:scale(1.4) rotate(12deg);}100%{transform:scale(1) rotate(0);}}
@keyframes fillerIn{from{opacity:0;transform:scale(.5) rotate(-10deg);}to{opacity:1;}}

/* toast / messages */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);
  background:rgba(255,255,255,.95);border:2px solid var(--purple);
  color:var(--ink);font-weight:600;padding:12px 20px;border-radius:18px;
  box-shadow:0 10px 26px rgba(120,90,170,.3);z-index:40;opacity:0;
  transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;
  max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .say{cursor:pointer;font-size:20px;}

/* win overlay */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(70,50,110,.35);backdrop-filter:blur(4px);padding:16px;
}
.win-card{
  background:#fff;border-radius:28px;padding:26px 24px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 24px 60px rgba(90,60,140,.4);animation:winIn .5s cubic-bezier(.2,1.5,.4,1);
}
@keyframes winIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.win-card h2{font-size:26px;color:var(--ink);}
.win-stars{font-size:44px;margin:6px 0;letter-spacing:4px;}
.win-stars .s{opacity:.25;}
.win-stars .s.on{opacity:1;animation:star .4s backwards;}
.win-stars .s:nth-child(1){animation-delay:.1s;}
.win-stars .s:nth-child(2){animation-delay:.3s;}
.win-stars .s:nth-child(3){animation-delay:.5s;}
@keyframes star{from{transform:scale(0) rotate(-40deg);}to{transform:scale(1) rotate(0);}}
.win-stats{display:flex;justify-content:center;gap:18px;margin:12px 0;color:var(--ink-soft);font-size:15px;flex-wrap:wrap;}
.win-stats b{display:block;font-size:22px;color:var(--purple);}
.win-best{font-size:14px;color:#ff8f6f;font-weight:600;min-height:18px;}
.win-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}

@media (max-width:520px){
  .panel{padding:14px 12px;}
  .pill{font-size:13px;padding:6px 9px;}
  .seg button,.opt{font-size:13px;padding:8px 11px;}
}
</style>
</head>
<body>

<div class="bg-doodles" id="doodles"></div>

<div class="wrap">

  <!-- ============ SETUP SCREEN ============ -->
  <div id="setup">
    <div class="title">Szó-Memória</div>
    <div class="subtitle">🐾 Párosítsd a magyar és angol szavakat! 🐾</div>

    <div class="panel">
      <h2>📚 Válassz témakört</h2>
      <div class="topics" id="topicGrid"></div>
    </div>

    <div class="panel setup-opts">
      <div class="opt-group">
        <h2>🎮 Mód</h2>
        <div class="seg" id="modeSeg">
          <button data-mode="memory" class="active">🙈 Memória<small>lapok lefordítva</small></button>
          <button data-mode="open">👀 Nyitott<small>minden látszik</small></button>
        </div>
      </div>
      <div class="opt-group">
        <h2>🧠 Segítség</h2>
        <div class="seg" id="helpSeg">
          <button data-help="both" >🐣 Kezdő<small>emoji + 2 nyelv</small></button>
          <button data-help="emoji" class="active">🐰 Haladó<small>emoji + 1 szó</small></button>
          <button data-help="word" >🦉 Profi<small>csak 1 szó</small></button>
        </div>
      </div>
      <div class="opt-group">
        <h2>🔢 Párok</h2>
        <div class="seg" id="sizeSeg">
          <button data-size="6" >Kicsi<small>6 pár</small></button>
          <button data-size="8" class="active">Közepes<small>8 pár</small></button>
          <button data-size="10" >Nagy<small>10 pár</small></button>
        </div>
      </div>
    </div>

    <div class="start-row">
      <button class="opt active" id="voiceToggle">🔊 Kiejtés: BE</button>
      <button class="big-btn" id="startBtn" disabled>Válassz témát! 🎯</button>
    </div>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="game" class="hidden">
    <div class="topbar">
      <button class="icon-btn" id="backBtn">‹ Vissza</button>
      <div class="pill" id="topicPill">🐶 <span></span></div>
      <div class="pill">🎯 Párok: <b id="pairCount">0/0</b></div>
      <div class="pill">👣 Lépés: <b id="moveCount">0</b></div>
      <div class="pill">⏱️ <b id="timeCount">0:00</b></div>
      <div class="pill combo" id="comboPill" style="display:none;">🔥 <span id="comboVal">x2</span></div>
      <button class="icon-btn" id="restartBtn">🔄 Újra</button>
    </div>

    <div class="board" id="board"></div>
  </div>

</div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script src="topics.js"></script>
<script>
/* ============================================================
   Szó-Memória – játéklogika
   ============================================================ */

// ---------- Web Audio: procedurális hangok ----------
let AC=null;
function audio(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,type,dur,vol,freqEnd,delay=0){
  const ac=audio();const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.02);
}
const SFX={
  flip:  ()=>tone(520,'sine',0.09,0.14,720),
  click: ()=>tone(440,'triangle',0.06,0.12,600),
  match: (n=0)=>[0,1,2].forEach(i=>tone([523,659,784,988][Math.min(i+Math.min(n,1),3)],'sine',0.18,0.18,null,i*0.08)),
  wrong: ()=>{tone(300,'sine',0.16,0.16,180);tone(220,'sine',0.2,0.12,140,0.05);},
  win:   ()=>[523,587,659,784,880,1047].forEach((f,i)=>tone(f,'sine',0.32,0.2,null,i*0.11)),
  surprise:()=>{[784,988,1319].forEach((f,i)=>tone(f,'sine',0.16,0.18,null,i*0.06));tone(1568,'triangle',0.12,0.1,null,0.18);},
};

// ---------- Web Speech: angol kiejtés ----------
let voiceOn=true, enVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  enVoice=vs.find(v=>/en[-_]?(GB|US)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){
  if(!voiceOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.85;u.pitch=1.15;
    if(enVoice)u.voice=enVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- állapot ----------
const state={
  topic:null, mode:'memory', help:'emoji', size:8,
  cards:[], first:null, second:null, lock:false,
  moves:0, matched:0, combo:0, startTime:0, timer:null, won:false,
};

const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

// ---------- háttér doodle-k ----------
(function(){
  const emojis=['🐾','⭐','☁️','🌸','💛','🐱','🍎','✨','🐶','🎈'];
  const box=$('#doodles');
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.textContent=emojis[i%emojis.length];
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.fontSize=(22+Math.random()*30)+'px';
    s.style.animationDuration=(7+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*8)+'s';
    box.appendChild(s);
  }
})();

// ---------- kezdőképernyő: témakör-rács ----------
const DIFF_LABEL={1:'⭐',2:'⭐⭐',3:'⭐⭐⭐'};
function buildTopics(){
  const grid=$('#topicGrid');
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const d=document.createElement('div');
    d.className='topic';d.dataset.id=t.id;
    d.innerHTML=`<span class="emo">${t.emoji}</span>
      <div class="nm">${t.hu}</div>
      <div class="diff">${DIFF_LABEL[t.difficulty]}</div>
      <div class="bar" style="background:${t.color}"></div>`;
    d.onclick=()=>selectTopic(t.id,d);
    grid.appendChild(d);
  });
  // véletlen kártya
  const r=document.createElement('div');
  r.className='topic random';r.dataset.id='__random';
  r.innerHTML=`<span class="emo">🎲</span><div class="nm">Véletlen</div>
    <div class="diff">meglepetés</div><div class="bar" style="background:linear-gradient(90deg,#ff9ec4,#a78bfa,#7fe0c4)"></div>`;
  r.onclick=()=>selectTopic('__random',r);
  grid.appendChild(r);
}
function selectTopic(id,el){
  SFX.click();
  document.querySelectorAll('.topic').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  state.topic=id;
  const btn=$('#startBtn');
  btn.disabled=false;btn.textContent='Kezdjük! 🚀';
}

// segment gombok
function segSetup(sel,key,cast=v=>v){
  $(sel).addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    SFX.click();
    $(sel).querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state[key]=cast(b.dataset[key]);
  });
}
segSetup('#modeSeg','mode');
segSetup('#helpSeg','help');
segSetup('#sizeSeg','size',v=>parseInt(v));

$('#voiceToggle').addEventListener('click',e=>{
  voiceOn=!voiceOn;
  e.target.classList.toggle('active',voiceOn);
  e.target.textContent='🔊 Kiejtés: '+(voiceOn?'BE':'KI');
  if(voiceOn)speak('hello');
});

// mobilon alapból kevesebb pár
if(window.innerWidth<600){
  state.size=6;
  $('#sizeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.size==='6'));
}

// ---------- játék indítása ----------
$('#startBtn').addEventListener('click',()=>{ if(!state.topic)return; audio(); startGame(); });
$('#backBtn').addEventListener('click',()=>{ stopTimer(); $('#game').classList.add('hidden'); $('#setup').classList.remove('hidden'); });
$('#restartBtn').addEventListener('click',()=>{ SFX.click(); startGame(); });

function chosenTopic(){
  if(state.topic==='__random') return TOPICS[Math.random()*TOPICS.length|0];
  return TOPICS.find(t=>t.id===state.topic);
}

function startGame(){
  const topic=chosenTopic();
  state.activeTopic=topic;
  const nPairs=Math.min(state.size,topic.words.length);
  const picked=shuffle([...topic.words]).slice(0,nPairs);

  // két kártya páronként: hu + en oldal
  let cards=[];
  picked.forEach((w,i)=>{
    cards.push({pairId:i,side:'hu',word:w});
    cards.push({pairId:i,side:'en',word:w});
  });
  shuffle(cards);
  state.cards=cards;
  state.first=state.second=null;state.lock=false;
  state.moves=0;state.matched=0;state.combo=0;state.won=false;

  renderBoard();

  // HUD
  $('#topicPill').innerHTML=`${topic.emoji} <span>${topic.hu}</span>`;
  $('#pairCount').textContent=`0/${nPairs}`;
  $('#moveCount').textContent='0';
  $('#comboPill').style.display='none';
  updateComboUI();

  $('#setup').classList.add('hidden');
  $('#game').classList.remove('hidden');
  removeOverlay();

  // a tábla mérete a látható képernyőhöz igazodik (két frame kell a helyes pozícióhoz)
  requestAnimationFrame(()=>requestAnimationFrame(layoutBoard));

  startTimer();
}

// A táblát úgy méretezzük, hogy a kártyák kiférjenek szélességben ÉS magasságban is –
// így soha nem kell görgetni. Kiválasztjuk azt az oszlopszámot, ami a legnagyobb kártyát adja.
function layoutBoard(){
  const board=$('#board');
  const N=state.cards.length;
  if(!N)return;
  const gap=Math.max(7,Math.min(13,window.innerWidth*0.018));
  const availW=Math.min(860,board.parentElement.clientWidth);
  const top=board.getBoundingClientRect().top;
  const availH=Math.max(240,window.innerHeight-top-28); // 28 = alsó térköz (wrap padding)
  const ratio=0.75; // kártya szélesség/magasság (aspect-ratio 3/4)
  let best={cols:Math.min(4,N),size:0};
  for(let c=2;c<=N;c++){
    const rows=Math.ceil(N/c);
    const byW=(availW-(c-1)*gap)/c;                 // szélesség adta max
    const byH=((availH-(rows-1)*gap)/rows)*ratio;   // magasság adta max
    const size=Math.min(byW,byH);
    if(size>best.size)best={cols:c,size};
  }
  board.style.setProperty('--cols',best.cols);
  board.style.maxWidth=Math.ceil(best.cols*best.size+(best.cols-1)*gap)+'px';
  board.style.gap=gap+'px';
  placeFillers(best.cols);
}

// cuki „meglepetés" kártyák az üresen maradt rács-helyekre (lefordítva maradnak)
const FILLER_EMOJIS=['🎁','🌈','🦄','🍭','⭐','🧁','🐣','🌟','💖','🍀','🎀','🌸','🐾','🍬','🦋','🌺'];
function makeFiller(i){
  const el=document.createElement('div');
  el.className='card filler';
  el.style.animationDelay=(0.05*i)+'s';
  el.style.setProperty('--topic-color',state.activeTopic.color); // hátlap = mint a többi kártyáé
  const motif=FILLER_EMOJIS[Math.random()*FILLER_EMOJIS.length|0];
  // hátlap: ugyanaz a tappancs, mint a rendes kártyáknál → nem lehet megkülönböztetni
  // előlap: a rejtett meglepetés
  el.innerHTML=`<div class="card-inner">
      <div class="face back"><span class="motif">🐾</span></div>
      <div class="face front">
        <span class="sparkle a">✨</span><span class="sparkle b">✨</span>
        <span class="fmotif">${motif}</span>
      </div>
    </div>`;
  el.addEventListener('click',()=>{
    if(el.classList.contains('flipped'))return; // már felfordítva → marad úgy
    el.classList.add('flipped');
    SFX.surprise();
    showToast('✨ Meglepetés! ✨');
  });
  return el;
}
// A dísz-kártyák VÉLETLENSZERŰ helyekre kerülnek a rácsban (nem csak a végére).
// Csak akkor rendezünk újra, ha az oszlopszám változik (ilyenkor a rács amúgy is átrendeződik),
// hogy játék közbeni átméretezéskor ne ugráljanak a megjegyzett kártyák.
function placeFillers(cols){
  const board=$('#board');
  const reals=[...board.querySelectorAll('.card:not(.filler)')];
  const N=reals.length;
  const rows=Math.ceil(N/cols);
  const need=cols*rows-N;
  const haveFillers=[...board.querySelectorAll('.card.filler')];
  if(cols===state._fillerCols&&haveFillers.length===need)return; // nincs változás
  state._fillerCols=cols;

  // dísz-kártyák beállítása a szükséges számra
  let fillers=haveFillers;
  if(fillers.length!==need){
    fillers.forEach(f=>f.remove());
    fillers=[];
    for(let i=0;i<need;i++)fillers.push(makeFiller(i));
  }

  // véletlen slotok kiválasztása a teljes rácsban
  const total=N+need;
  const fillerSlots=new Set();
  while(fillerSlots.size<need)fillerSlots.add(Math.random()*total|0);

  // végleges sorrend összeállítása és alkalmazása a DOM-ra
  let ri=0,fi=0;
  for(let i=0;i<total;i++){
    board.appendChild(fillerSlots.has(i)?fillers[fi++]:reals[ri++]);
  }
}

function renderBoard(){
  const board=$('#board');
  board.innerHTML='';
  state._fillerCols=null; // új tábla → dísz-kártyák újratervezése
  const open=state.mode==='open';

  state.cards.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='card';
    el.style.animationDelay=(idx*0.035)+'s';
    el.style.setProperty('--topic-color',state.activeTopic.color);

    el.innerHTML=`
      <div class="card-inner">
        <div class="face back"><span class="motif">🐾</span></div>
        <div class="face front">${frontHTML(c)}</div>
      </div>`;
    c.el=el;c.done=false;
    if(open){ el.classList.add('flipped'); c.revealed=true; }
    else { c.revealed=false; }
    el.addEventListener('click',()=>onCardClick(c));
    board.appendChild(el);
  });
}

function frontHTML(c){
  const w=c.word;
  const primary=c.side==='hu'?w.hu:w.en;
  const secondary=c.side==='hu'?w.en:w.hu;
  const tag=`<span class="lang-tag ${c.side}">${c.side==='hu'?'HU':'EN'}</span>`;
  let inner='';
  if(state.help==='both'){
    inner=`<span class="fx-emoji">${w.emoji}</span>
           <span class="fx-word">${primary}</span>
           <span class="fx-sub">${secondary}</span>`;
  }else if(state.help==='emoji'){
    inner=`<span class="fx-emoji">${w.emoji}</span>
           <span class="fx-word">${primary}</span>`;
  }else{ // word only
    inner=`<span class="fx-word" style="font-size:clamp(13px,3.6vw,22px)">${primary}</span>`;
  }
  return tag+inner;
}

// ---------- kattintás kezelés ----------
function onCardClick(c){
  if(state.lock||c.done||state.won)return;
  if(state.mode==='memory'){
    if(c===state.first)return;         // ugyanaz
    if(!c.revealed){ flip(c,true); SFX.flip(); }
  }else{
    if(c===state.first)return;
    SFX.flip();
  }
  // kiejtés lapfordításkor (angol oldal)
  if(c.side==='en'&&state.mode==='memory'&&state.help!=='word') speak(c.word.en);

  if(!state.first){ state.first=c; markSel(c,true); return; }
  state.second=c; markSel(c,true);
  state.moves++; $('#moveCount').textContent=state.moves;
  state.lock=true;
  setTimeout(evaluate,state.mode==='open'?220:340);
}

function markSel(c,on){
  c.el.style.outline=on?'3px solid rgba(167,139,250,.7)':'';
  c.el.style.outlineOffset=on?'2px':'';
  c.el.style.borderRadius='var(--card-radius)';
}

function flip(c,shown){
  c.revealed=shown;
  c.el.classList.toggle('flipped',shown);
}

function evaluate(){
  const a=state.first,b=state.second;
  markSel(a,false);markSel(b,false);
  if(a.pairId===b.pairId){
    // találat!
    a.done=b.done=true;
    a.el.classList.add('matched');b.el.classList.add('matched');
    state.matched++;state.combo++;
    SFX.match(state.combo-1);
    speak(a.word.en);
    updateComboUI();
    showToast(`🎉 ${a.word.hu} = ${a.word.en}`, a.word.en);
    $('#pairCount').textContent=`${state.matched}/${state.cards.length/2}`;
    resetPick();
    if(state.matched===state.cards.length/2) winGame();
  }else{
    // nem talált
    SFX.wrong();
    state.combo=0;updateComboUI();
    a.el.classList.add('wrong');b.el.classList.add('wrong');
    const closeBack=()=>{
      a.el.classList.remove('wrong');b.el.classList.remove('wrong');
      if(state.mode==='memory'){ flip(a,false);flip(b,false); }
      resetPick();
    };
    setTimeout(closeBack,state.mode==='open'?450:820);
  }
}
function resetPick(){ state.first=state.second=null; state.lock=false; }

function updateComboUI(){
  const pill=$('#comboPill');
  if(state.combo>=2){
    pill.style.display='';
    $('#comboVal').textContent='x'+state.combo;
    pill.classList.add('pop');
    setTimeout(()=>pill.classList.remove('pop'),200);
  }else{
    pill.style.display='none';
  }
}

// ---------- toast ----------
let toastT=null;
function showToast(msg,say){
  const t=$('#toast');
  t.innerHTML=`<span>${msg}</span>`+(say?`<span class="say" title="Halld újra">🔊</span>`:'');
  if(say){ t.querySelector('.say').onclick=()=>speak(say); }
  t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1600);
}

// ---------- idő ----------
function startTimer(){
  stopTimer();state.startTime=Date.now();
  state.timer=setInterval(()=>{
    const s=Math.floor((Date.now()-state.startTime)/1000);
    $('#timeCount').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  },500);
}
function stopTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }

// ---------- győzelem ----------
function bestKey(){ return `szomem_best_${state.activeTopic.id}_${state.cards.length/2}_${state.mode}`; }
function winGame(){
  state.won=true;stopTimer();
  const secs=Math.floor((Date.now()-state.startTime)/1000);
  const pairs=state.cards.length/2;
  // csillagok: kevesebb lépés = több csillag
  let stars=1;
  if(state.moves<=pairs*1.4)stars=3;
  else if(state.moves<=pairs*2.1)stars=2;

  // rekord
  let best=null;try{best=JSON.parse(localStorage.getItem(bestKey()));}catch(e){}
  let isRecord=false;
  if(!best||state.moves<best.moves||(state.moves===best.moves&&secs<best.secs)){
    best={moves:state.moves,secs,stars};isRecord=true;
    try{localStorage.setItem(bestKey(),JSON.stringify(best));}catch(e){}
  }

  setTimeout(()=>{ SFX.win(); confetti(); showWin(stars,secs,best,isRecord); },350);
}

function showWin(stars,secs,best,isRecord){
  const t=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const bt=Math.floor(best.secs/60)+':'+String(best.secs%60).padStart(2,'0');
  const praise=stars===3?'Zseniális! 🌟':stars===2?'Szuper voltál! 😺':'Ügyes vagy! 🐾';
  const ov=document.createElement('div');
  ov.className='overlay';ov.id='winOverlay';
  ov.innerHTML=`
    <div class="win-card">
      <h2>${praise}</h2>
      <div class="win-stars">
        <span class="s ${stars>=1?'on':''}">⭐</span>
        <span class="s ${stars>=2?'on':''}">⭐</span>
        <span class="s ${stars>=3?'on':''}">⭐</span>
      </div>
      <div class="win-stats">
        <div>👣<b>${state.moves}</b>lépés</div>
        <div>⏱️<b>${t}</b>idő</div>
      </div>
      <div class="win-best">${isRecord?'🏆 Új rekord!':`🏅 Rekord: ${best.moves} lépés · ${bt}`}</div>
      <div class="win-btns">
        <button class="big-btn" id="againBtn">🔄 Újra</button>
        <button class="big-btn ghost" id="menuBtn">📚 Új téma</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  $('#againBtn').onclick=()=>{ SFX.click();startGame(); };
  $('#menuBtn').onclick=()=>{ SFX.click();removeOverlay();$('#game').classList.add('hidden');$('#setup').classList.remove('hidden'); };
}
function removeOverlay(){ const o=$('#winOverlay'); if(o)o.remove(); }

// ---------- konfetti ----------
const confCanvas=$('#confetti');const cctx=confCanvas.getContext('2d');
let confParts=[],confRAF=null;
function confetti(){
  confCanvas.width=innerWidth;confCanvas.height=innerHeight;
  const colors=['#ff9ec4','#a78bfa','#7fe0c4','#ffd873','#8fd3ff','#ff8f6f'];
  confParts=[];
  for(let i=0;i<140;i++){
    confParts.push({
      x:innerWidth/2+(Math.random()-0.5)*120,
      y:innerHeight/2-40,
      vx:(Math.random()-0.5)*11,
      vy:Math.random()*-13-4,
      g:0.32+Math.random()*0.15,
      s:6+Math.random()*7,
      rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,
      c:colors[i%colors.length],life:1,
    });
  }
  if(!confRAF)confLoop();
}
function confLoop(){
  cctx.clearRect(0,0,confCanvas.width,confCanvas.height);
  let alive=false;
  confParts.forEach(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=0.006;
    if(p.y<confCanvas.height+20&&p.life>0){
      alive=true;
      cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);
      cctx.globalAlpha=Math.max(0,p.life);
      cctx.fillStyle=p.c;cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      cctx.restore();
    }
  });
  if(alive){ confRAF=requestAnimationFrame(confLoop); }
  else { cctx.clearRect(0,0,confCanvas.width,confCanvas.height); confRAF=null; }
}

// ---------- reszponzív: oszlopszám újraszámítás ----------
window.addEventListener('resize',()=>{
  if(!$('#game').classList.contains('hidden')&&state.cards.length) layoutBoard();
});
window.addEventListener('orientationchange',()=>{
  if(!$('#game').classList.contains('hidden')&&state.cards.length) setTimeout(layoutBoard,250);
});

// indulás
buildTopics();
</script>
